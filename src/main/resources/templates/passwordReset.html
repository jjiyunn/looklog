<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/nav :: head('password-reset')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="pw-reset-container">

  <!-- STEP 1: 이메일 입력 -->
  <div id="step-email">
    <h2>비밀번호 재설정</h2>
    <p>가입하신 이메일을 입력하면 인증 코드를 보내드려요.</p>

    <input type="email" id="reset-email" placeholder="이메일">
    <span id="email-error" class="field-error"></span>

    <button id="request-code-btn" type="button">인증 코드 받기</button>
  </div>

  <!-- STEP 2: 코드 입력 -->
  <div id="step-code" hidden>
    <h2>인증 코드 입력</h2>
    <p>메일로 받은 6자리 코드를 입력해주세요.</p>

    <input type="text" id="reset-code" maxlength="6" placeholder="인증 코드 6자리">
    <span id="code-error" class="field-error"></span>

    <button id="verify-code-btn" type="button">확인</button>
    <button id="resend-code-btn" type="button" class="link-btn">코드 재전송</button>
  </div>

  <!-- STEP 3: 새 비밀번호 -->
  <div id="step-password" hidden>
    <h2>새 비밀번호 설정</h2>

    <input type="password" id="new-password" placeholder="새 비밀번호">
    <span id="new-password-error" class="field-error"></span>

    <input type="password" id="new-password-check" placeholder="비밀번호 확인">
    <span id="new-password-check-error" class="field-error"></span>

    <button id="reset-submit-btn" type="button">비밀번호 변경</button>
  </div>

</div>

<script>
  const PASSWORD_PATTERN = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>/?]).{8,20}$/;

  let verifiedEmail = '';
  let verifiedCode = '';

  const stepEmail = document.getElementById('step-email');
  const stepCode = document.getElementById('step-code');
  const stepPassword = document.getElementById('step-password');

  // STEP 1 -> 2
  document.getElementById('request-code-btn').addEventListener('click', function () {
    const email = document.getElementById('reset-email').value;
    const errorEl = document.getElementById('email-error');
    const btn = this;

    errorEl.textContent = '';
    btn.disabled = true;
    btn.textContent = '전송 중...';

    fetch('/password-reset/request', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'email=' + encodeURIComponent(email)
    })
        .then(res => {
          btn.disabled = false;
          btn.textContent = '인증 코드 받기';

          if (res.ok) {
            verifiedEmail = email;
            stepEmail.hidden = true;
            stepCode.hidden = false;
          } else {
            res.text().then(msg => errorEl.textContent = msg);
          }
        });
  });

  // STEP 2 -> 3
  document.getElementById('verify-code-btn').addEventListener('click', function () {
    const code = document.getElementById('reset-code').value;
    const errorEl = document.getElementById('code-error');
    const btn = this;

    errorEl.textContent = '';
    btn.disabled = true;
    btn.textContent = '확인 중...';

    fetch('/password-reset/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'email=' + encodeURIComponent(verifiedEmail) + '&code=' + encodeURIComponent(code)
    })
        .then(res => {
          btn.disabled = false;
          btn.textContent = '확인';

          if (res.ok) {
            verifiedCode = code;
            stepCode.hidden = true;
            stepPassword.hidden = false;
          } else {
            res.text().then(msg => errorEl.textContent = msg);
          }
        });
  });

  // 코드 재전송
  document.getElementById('resend-code-btn').addEventListener('click', function () {
    const btn = this;
    btn.disabled = true;
    btn.textContent = '전송 중...';

    fetch('/password-reset/request', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'email=' + encodeURIComponent(verifiedEmail)
    })
        .then(res => {
          btn.disabled = false;
          btn.textContent = '코드 재전송';
          alert(res.ok ? '인증 코드를 재전송했습니다.' : '재전송에 실패했습니다.');
        });
  });

  // STEP 3: 비밀번호 변경
  document.getElementById('reset-submit-btn').addEventListener('click', function () {
    const newPassword = document.getElementById('new-password').value;
    const newPasswordCheck = document.getElementById('new-password-check').value;
    const pwError = document.getElementById('new-password-error');
    const pwCheckError = document.getElementById('new-password-check-error');
    const btn = this;

    pwError.textContent = '';
    pwCheckError.textContent = '';

    if (!PASSWORD_PATTERN.test(newPassword)) {
      pwError.textContent = '8~20자, 영문/숫자/특수문자를 포함해야 합니다.';
      return;
    }
    if (newPassword !== newPasswordCheck) {
      pwCheckError.textContent = '비밀번호가 일치하지 않습니다.';
      return;
    }

    btn.disabled = true;
    btn.textContent = '변경 중...';

    fetch('/password-reset/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        email: verifiedEmail,
        code: verifiedCode,
        newPassword: newPassword
      })
    })
        .then(res => {
          btn.disabled = false;
          btn.textContent = '비밀번호 변경';

          if (res.ok) {
            alert('비밀번호가 변경되었습니다. 다시 로그인해주세요.');
            location.href = '/login';
          } else {
            res.text().then(msg => pwError.textContent = msg);
          }
        });
  });
</script>

</body>
</html>
