<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/nav :: head('profile')}"></head>
<body>
  <div th:replace="~{fragments/nav :: nav}"></div>

  <section>
    <div class="profile-header">

      <i class="bi bi-chevron-left back-btn profile-back-btn"></i>

      <div class="profile-more-wrap" th:unless="${isWithdrawn}">
        <button class="more-menu-btn" id="more-menu-btn">
          <i class="ti ti-dots-vertical"></i>
        </button>
        <div class="more-menu-dropdown" id="more-menu-dropdown" hidden>
          <a th:if="${isOwner}" class="menu-item" id="edit-profile-btn" href="/profile/edit">프로필 수정</a>
          <button class="menu-item" id="share-profile-btn">공유</button>
          <button th:if="${isOwner}" class="menu-item" id="toggle-profile-visibility-btn"
                  th:attr="data-public=${profileMember.profilePublic}">
            <span th:text="${profileMember.profilePublic} ? '프로필 비공개' : '프로필 공개'"></span>
          </button>
          <button th:unless="${isOwner}" class="menu-item" id="report-member-btn" th:attr="data-member-id=${profileMember.id}">신고</button>
          <button th:if="${isOwner}" class="menu-item menu-item-danger" id="withdraw-btn">회원탈퇴</button>
        </div>
      </div>

      <img th:src="${profileMember.profileImg}" alt="프로필" class="profile-avatar">
      <h2 th:text="${profileMember.name}"></h2>
      <p class="profile-username" th:text="'@' + ${profileMember.userName}"></p>

      <div class="profile-follow-count">
        <span class="follow-count-btn" id="follower-count-btn"
              th:attr="data-member-id=${profileMember.id}"
              data-type="followers">
          <span id="follower-count" th:text="${followerCount}"></span> 팔로워
        </span>
              <span class="follow-count-btn" id="following-count-btn"
                    th:attr="data-member-id=${profileMember.id}"
                    data-type="followings">
          <span th:text="${followingCount}"></span> 팔로잉
        </span>
      </div>

      <p class="profile-bio" th:text="${profileMember.bio}"></p>

      <button th:if="${!isOwner && !isWithdrawn}" id="follow-btn"
              th:attr="data-member-id=${profileMember.id}"
              th:classappend="${isFollowing} ? ' following' : ''"
              th:text="${isFollowing} ? '팔로잉' : '팔로우'">
      </button>

    </div>


<!--    피드/ 옷장-->
    <div th:if="${isPrivateBlocked}" class="private-profile-message">
      <i class="ti ti-lock"></i>
      <p>비공개 계정입니다</p>
    </div>

    <div th:unless="${isPrivateBlocked}">
      <div class="profile-tabs">
        <button class="tab-btn active" data-tab="feed">피드</button>
        <button class="tab-btn" data-tab="closet">옷장</button>
      </div>

      <div class="tab-content" id="tab-feed">
        <div class="feed">
          <div class="feed-item" th:each="board : ${boards}">
            <a class="feed-img-wrap" th:href="@{/board/{id}(id=${board.id})}">
              <img th:src="${board.img}" alt="게시글" class="feed-img">
            </a>

            <div class="feed-info">
              <span class="feed-username" th:text="${board.userName}"></span>

              <div class="feed-tags">
                <span class="feed-tag" th:each="t : ${board.tags}" th:text="'#' + ${t}"></span>
              </div>

              <button class="closet-btn" th:attr="data-board-id=${board.id}"
                      th:classappend="${board.savedByMe} ? ' saved' : ''">
                <i class="ti ti-hanger"></i>
                <span class="check material-symbols-rounded">check</span>
              </button>

              <button class="like-btn"
                      th:attr="data-board-id=${board.id}"
                      th:classappend="${board.likedByMe} ? ' liked' : ''">
                <i class="bi bi-heart-fill"></i>
                <span class="like-count" th:text="${board.likeCount}"></span>
              </button>
            </div>

          </div>
        </div>
      </div>
    </div>

    <div class="tab-content" id="tab-closet" hidden>
      <div class="drawer-folder-grid">
        <a class="drawer-folder" th:each="d : ${drawers}" th:href="@{/drawer/{id}(id=${d.id})}">

          <!-- 썸네일: 3개 이하 = 이미지 1장 -->
          <div class="drawer-thumb single" th:if="${d.itemCount <= 3}">
            <img th:if="${!d.thumbnails.isEmpty()}" th:src="${d.thumbnails[0]}" alt="서랍 썸네일">
            <div class="drawer-thumb-empty" th:if="${d.thumbnails.isEmpty()}"></div>
          </div>

          <!-- 썸네일: 4개 이상 = 2x2 그리드 -->
          <div class="drawer-thumb grid" th:if="${d.itemCount >= 4}">
            <img th:each="thumb : ${d.thumbnails}" th:src="${thumb}" alt="서랍 썸네일">
          </div>

          <div class="drawer-folder-info">
            <span class="drawer-folder-name" th:text="${d.name}"></span>
            <span class="drawer-folder-count" th:text="${d.itemCount} + '개'"></span>
          </div>
        </a>

        <!-- 서랍 추가 -->
        <button class="drawer-folder-add" id="add-drawer-btn" type="button" th:if="${session.loginMemberId == profileMember.id}">
          <div class="drawer-thumb add">
            <i class="ti ti-plus"></i>
          </div>
        </button>
      </div>
    </div>

    <!-- 서랍 추가 모달 -->
    <div class="modal-overlay" id="add-drawer-modal" hidden>
      <div class="modal-box">
        <h3>새 서랍 만들기</h3>
        <input type="text" id="add-drawer-input" placeholder="서랍 이름" maxlength="20">
        <small id="add-drawer-error" class="field-hint invalid"></small>
        <div class="modal-actions">
          <button id="add-drawer-cancel-btn" class="cancel-btn">취소</button>
          <button id="add-drawer-confirm-btn" class="confirm-btn">만들기</button>
        </div>
      </div>
    </div>



    <button id="upload-open-btn" class="fab-upload">
      <span>+</span>
    </button>

  </section>


  <!-- 팔로워 확인 모달 -->
  <div class="follow-modal-overlay" id="follow-modal-overlay" hidden>
    <div class="follow-modal">
      <div class="follow-modal-header">
        <h3 id="follow-modal-title">팔로워</h3>
        <button id="follow-modal-close" type="button"><i class="ti ti-x"></i></button>
      </div>

      <ul class="follow-modal-list" id="follow-modal-list">
      </ul>
    </div>
  </div>

  <!-- 탈퇴 확인 모달 -->
  <div class="modal-overlay" id="withdraw-modal" hidden>
    <div class="modal-box">
      <h3>정말 탈퇴하시겠어요?</h3>
      <p>탈퇴 시 계정 정보가 삭제됩니다.<br />피드는 사라지지 않습니다.</p>
      <input type="password" id="withdraw-password" placeholder="비밀번호 확인">
      <small id="withdraw-error"></small>
      <div class="modal-actions">
        <button id="withdraw-cancel-btn" class="cancel-btn">취소</button>
        <button id="withdraw-confirm-btn" class="confirm-btn">탈퇴하기</button>
      </div>
    </div>
  </div>


  <div id="toast-container"></div>

  <div th:replace="~{fragments/upload-modal :: uploadModal}"></div>
  <div th:replace="~{fragments/drawer-modal :: drawerModal}"></div>
  <div th:replace="~{fragments/report-modal :: reportModal}"></div>


  <script src="/js/common.js"></script>
  <script src="/js/board-detail.js"></script>
</body>
</html>
