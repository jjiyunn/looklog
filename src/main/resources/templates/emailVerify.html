<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/nav :: head('email-verify')}"></head>
  <body>
    <div th:replace="~{fragments/nav :: nav}"></div>

    <div class="email-verify-container">
      <h2>이메일 인증</h2>
      <p>가입하신 이메일로 인증 코드를 보냈어요.<br />받은 6자리 코드를 입력해주세요.</p>

      <form id="verifyForm">
        <input type="text" id="code" name="code" maxlength="6" placeholder="인증 코드 6자리" required>
        <span id="codeError" class="field-error"></span>

        <button type="submit">인증하기</button>
      </form>

      <button id="resendBtn" type="button">인증 코드 재전송</button>

      <a href="/logout" class="logout-link">다른 계정으로 로그인</a>
    </div>

    <script>
      document.getElementById('verifyForm').addEventListener('submit', function (e) {
        e.preventDefault();

        const code = document.getElementById('code').value;
        const errorEl = document.getElementById('codeError');
        const submitBtn = e.target.querySelector('button[type="submit"]');
        errorEl.textContent = '';

        submitBtn.disabled = true;
        submitBtn.textContent = '확인 중...';

        fetch('/email-verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'code=' + encodeURIComponent(code)
        })
            .then(res => {
              if (res.ok) {
                location.href = '/looklog';
              } else {
                res.text().then(msg => {
                  errorEl.textContent = msg;
                  submitBtn.disabled = false;
                  submitBtn.textContent = '인증하기';
                });
              }
            });
      });

      document.getElementById('resendBtn').addEventListener('click', function () {
        const resendBtn = this;
        resendBtn.disabled = true;
        resendBtn.textContent = '전송 중...';

        fetch('/email-verify/resend', { method: 'POST' })
            .then(res => {
              resendBtn.disabled = false;
              resendBtn.textContent = '인증 코드 재전송';

              if (res.ok) {
                alert('인증 코드를 재전송했습니다.');
              } else {
                res.text().then(msg => alert(msg));
              }
            });
      });
    </script>

  </body>
</html>
