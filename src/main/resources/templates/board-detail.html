<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/nav :: head('board-detail')}"></head>
<body>
  <div th:replace="~{fragments/nav :: nav}"></div>

  <div class="board-detail-wrap">

    <div class="board-detail-main">

      <div class="board-detail-header">

        <i class="bi bi-chevron-left back-btn"></i>

        <div class="more-menu-wrap">
          <button class="more-menu-btn" id="more-menu-btn">
            <i class="ti ti-dots-vertical"></i>
          </button>

          <div class="more-menu-dropdown" id="more-menu-dropdown" hidden>
            <!-- 본인 게시글일 때 -->
            <div th:if="${board.owner}">
              <button class="menu-item" id="edit-board-btn"
                      th:attr="data-board-id=${board.id},
                    data-content=${board.content},
                    data-img=${board.img},
                    data-tags=${#strings.listJoin(board.tags, ',')}">
                수정
              </button>
              <button class="menu-item" id="delete-board-btn" th:attr="data-board-id=${board.id}">삭제</button>
              <button class="menu-item" id="share-board-btn">공유</button>
            </div>

            <!-- 본인 게시글 아닐 때 -->
            <div th:unless="${board.owner}">
              <button class="menu-item" id="report-board-btn" th:attr="data-board-id=${board.id}">신고</button>
              <button class="menu-item" id="share-board-btn">공유</button>
            </div>
          </div>
        </div>
      </div>

      <img th:src="${board.img}" alt="게시글 이미지" class="board-detail-img">

      <div class="board-detail-info">

        <div class="board-detail-flex">
          <a th:href="@{/profile/{name}(name=${board.userName})}" class="board-detail-profile-link">
            <img th:src="${board.profileImg}" alt="프로필" class="board-detail-avatar">
            <span class="board-detail-username" th:text="${board.userName}"></span>
          </a>

          <div class="board-detail-actions">
            <button class="like-btn" th:attr="data-board-id=${board.id}"
                    th:classappend="${board.likedByMe} ? ' liked' : ''">
              <i class="bi bi-heart-fill"></i>
              <span class="like-count" th:text="${board.likeCount}"></span>
            </button>

            <button class="closet-btn" th:attr="data-board-id=${board.id}"
                    th:classappend="${board.savedByMe} ? ' saved' : ''">
              <i class="ti ti-hanger"></i>
              <span class="check material-symbols-rounded">check</span>
            </button>
          </div>
        </div>

        <p class="board-detail-content" th:text="${board.content}"></p>

        <div class="board-detail-tags">
          <span class="feed-tag" th:each="t : ${board.tags}" th:text="'#' + ${t}"></span>
        </div>

      </div>
    </div>


    <div class="board-detail-related">
      <div class="feed">
        <div class="feed-item" th:each="rb : ${relatedBoards}">
          <a class="feed-img-wrap" th:href="@{/board/{id}(id=${rb.id})}">
            <img th:src="${rb.img}" alt="관련 게시글">
          </a>

          <div class="feed-info">
            <span class="feed-username" th:text="${rb.userName}"></span>

            <div class="feed-tags">
              <span class="feed-tag" th:each="t : ${rb.tags}" th:text="'#' + ${t}"></span>
            </div>

            <button class="closet-btn" th:attr="data-board-id=${rb.id}"
                    th:classappend="${rb.savedByMe} ? ' saved' : ''">
              <i class="ti ti-hanger"></i>
              <span class="check material-symbols-rounded">check</span>
            </button>

            <button class="like-btn" th:attr="data-board-id=${rb.id}"
                    th:classappend="${rb.likedByMe} ? ' liked' : ''">
              <i class="bi bi-heart-fill"></i>
              <span class="like-count" th:text="${rb.likeCount}"></span>
            </button>
          </div>
        </div>
      </div>
    </div>

  </div>



  <button id="upload-open-btn" class="fab-upload">
    <span>+</span>
  </button>



  <div th:replace="~{fragments/upload-modal :: uploadModal}"></div>
  <div th:replace="~{fragments/drawer-modal :: drawerModal}"></div>

  <script src="/js/common.js"></script>
  <script src="/js/board-detail.js"></script>
</body>
</html>
